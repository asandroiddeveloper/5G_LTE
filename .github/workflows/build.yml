name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit tests, debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (matches gradle/gradle-daemon-jvm.properties)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint, unit tests and debug build
        run: |
          set -o pipefail
          # assembleRelease also exercises R8 and resource shrinking (AGP 9.3 optimization).
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report build failures on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LINT_REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          {
            echo 'Build failed.'
            if [ -f "$LINT_REPORT" ]; then
              echo
              echo '### Lint issues'
              echo
              echo '```'
              grep -E "^/home/runner/.*(Error|Warning): " "$LINT_REPORT" | head -60 || true
              echo '```'
            fi
            echo
            echo '### Gradle output tail'
            echo
            echo '```'
            tail -c 1500 "$RUNNER_TEMP/gradle.log" || true
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Set these four repository secrets to get a signed release APK:
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write signing config from secrets
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${GITHUB_REF_NAME#v}

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_SIGNING != 'true'
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}

      - name: Publish signed release
        if: env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      - name: Publish debug build (unsigned fallback)
        if: env.HAS_SIGNING != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
